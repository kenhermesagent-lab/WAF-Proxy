version: 2
# Minor and patch bumps arrive as one grouped PR per ecosystem; majors stay
# separate so a breaking upgrade is reviewed on its own.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      console-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # These majors depend on each other: plugin-react 6 requires Vite 8, so a
      # lone major PR cannot pass the console build and tests.
      console-build-toolchain:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - vitest
          - jsdom
          - typescript
        update-types: ["major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
