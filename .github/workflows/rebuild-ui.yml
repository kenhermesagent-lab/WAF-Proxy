name: Rebuild UI bundle

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-ui
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild and commit internal/webui/dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the console
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Commit the rebuilt bundle
        run: |
          git config user.name "Codebuff Agent"
          git config user.email "noreply@codebuff.com"
          git add -A internal/webui/dist
          if git diff --cached --quiet; then
            echo "dist already matches the source"
            exit 0
          fi
          git commit -m "Rebuild the admin UI bundle" \
            -m "The committed dist was one build behind web/src, so the embedded console still served the old globe. Rebuilt from web/ with npm run build." \
            -m "$(printf '%s\n%s' '🤖 Generated with Codebuff' 'Co-Authored-By: Codebuff <noreply@codebuff.com>')"
          git push
