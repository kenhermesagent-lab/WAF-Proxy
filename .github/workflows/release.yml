name: Release

on:
  push:
    tags: ['v*']
  # Lets a tag created elsewhere (for example by a release API) get its assets.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the built binaries to
        required: true

permissions:
  contents: write
  # Keyless signing and provenance: the job proves its identity to Fulcio and
  # the attestation service with the workflow's OIDC token, so no key is stored.
  id-token: write
  attestations: write

jobs:
  assets:
    name: Build, sign and attach binaries
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      # Actions are pinned to commit SHAs, not tags: a moved tag would otherwise
      # change what the job runs while the signature still vouches for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The build stamps VERSION into every binary and the release takes its name
      # from the tag, so a tag that disagrees with VERSION would publish 1.2.3
      # artifacts under a v9.8.7 release. Fail before anything is built or signed.
      - name: Check the tag matches VERSION
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          if [[ ${TAG#v} != "$version" ]]; then
            echo "tag '${TAG}' does not match VERSION ${version} at ${GITHUB_SHA}" >&2
            echo "  a release tag must name the version VERSION holds at the commit it points at" >&2
            exit 1
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build linux amd64 and arm64 binaries
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          ldflags="-s -w \
            -X github.com/kenhermesagent-lab/waf-proxy-docker/internal/version.Version=${version} \
            -X github.com/kenhermesagent-lab/waf-proxy-docker/internal/version.Commit=${GITHUB_SHA::7} \
            -X github.com/kenhermesagent-lab/waf-proxy-docker/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -X github.com/kenhermesagent-lab/waf-proxy-docker/internal/updates.AppRepo=${GITHUB_REPOSITORY}"
          mkdir -p dist
          for arch in amd64 arm64; do
            for bin in wafproxy wafproxy-updated; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" \
                -o "dist/${bin}_${version}_linux_${arch}" "./cmd/${bin}"
            done
          done
          (cd dist && sha256sum *_linux_* > SHA256SUMS)
      # Attest before signing so the subjects are the built artifacts, not the bundles.
      - name: Publish build provenance for the artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |-
            dist/*_linux_*
            dist/SHA256SUMS
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.4.1'
      - name: Sign each binary and the checksum list keyless
        run: |-
          set -euo pipefail
          # --bundle writes the signature, Fulcio certificate and Rekor entry as
          # one file next to the artifact; nothing is stored between runs.
          cd dist
          for f in *_linux_* SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Verify what will be published
        run: |-
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          identity="^https://github.com/${REPO}/.github/workflows/release.yml@"
          # Walk the bundles, not the artifacts: *_linux_* would also match the
          # bundles themselves once signing has run.
          for bundle in *.sigstore.json; do
            cosign verify-blob "${bundle%.sigstore.json}" \
              --bundle "$bundle" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Record how to verify this release
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          {
            echo "### Verify this release"
            echo ''
            echo 'Each binary and `SHA256SUMS` carries a `.sigstore.json` bundle; provenance is'
            echo 'queryable with `gh attestation verify`. No key is involved — the certificate'
            echo 'names this workflow as the signer.'
            echo ''
            echo '```sh'
            echo "cosign verify-blob wafproxy_${version}_linux_amd64 \\"
            echo "  --bundle wafproxy_${version}_linux_amd64.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO}/.github/workflows/release.yml@' \\"
            echo '  --certificate-oidc-issuer https://token.actions.githubusercontent.com'
            echo 'sha256sum -c SHA256SUMS'
            echo "gh attestation verify wafproxy_${version}_linux_amd64 --repo ${REPO}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the binaries, bundles and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "WAF-Proxy ${TAG#v}"
          fi
