name: Release

on:
  push:
    tags: ['v*']
  # Lets a tag created elsewhere (for example by a release API) get its assets.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the built binaries to
        required: true

permissions:
  contents: write
  # Keyless signing and provenance: the job proves its identity to Fulcio and
  # the attestation service with the workflow's OIDC token, so no key is stored.
  id-token: write
  attestations: write

jobs:
  assets:
    name: Build, sign and attach binaries
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      # Actions are pinned to commit SHAs, not tags: a moved tag would otherwise
      # change what the job runs while the signature still vouches for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The build stamps VERSION into every binary and the release takes its name
      # from the tag, so a tag that disagrees with VERSION would publish 1.2.3
      # artifacts under a v9.8.7 release. Fail before anything is built or signed.
      - name: Check the tag matches VERSION
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          if [[ ${TAG#v} != "$version" ]]; then
            echo "tag '${TAG}' does not match VERSION ${version} at ${GITHUB_SHA}" >&2
            echo "  a release tag must name the version VERSION holds at the commit it points at" >&2
            exit 1
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build linux amd64 and arm64 binaries
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          ldflags="-s -w \
            -X github.com/kenhermesagent-lab/waf-proxy-docker/internal/version.Version=${version} \
            -X github.com/kenhermesagent-lab/waf-proxy-docker/internal/version.Commit=${GITHUB_SHA::7} \
            -X github.com/kenhermesagent-lab/waf-proxy-docker/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -X github.com/kenhermesagent-lab/waf-proxy-docker/internal/updates.AppRepo=${GITHUB_REPOSITORY}"
          mkdir -p dist
          for arch in amd64 arm64; do
            for bin in wafproxy wafproxy-updated; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" \
                -o "dist/${bin}_${version}_linux_${arch}" "./cmd/${bin}"
            done
          done
          (cd dist && sha256sum *_linux_* > SHA256SUMS)
      # Attest before signing so the subjects are the built artifacts, not the bundles.
      - name: Publish build provenance for the artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |-
            dist/*_linux_*
            dist/SHA256SUMS
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.4.1'
      - name: Sign each binary and the checksum list keyless
        run: |-
          set -euo pipefail
          # --bundle writes the signature, Fulcio certificate and Rekor entry as
          # one file next to the artifact; nothing is stored between runs.
          cd dist
          for f in *_linux_* SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Verify what will be published
        run: |-
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          identity="^https://github.com/${REPO}/.github/workflows/release.yml@"
          # Walk the bundles, not the artifacts: *_linux_* would also match the
          # bundles themselves once signing has run.
          for bundle in *.sigstore.json; do
            cosign verify-blob "${bundle%.sigstore.json}" \
              --bundle "$bundle" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Record how to verify this release
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          {
            echo "### Verify this release"
            echo ''
            echo 'Each binary and `SHA256SUMS` carries a `.sigstore.json` bundle; provenance is'
            echo 'queryable with `gh attestation verify`. No key is involved — the certificate'
            echo 'names this workflow as the signer.'
            echo ''
            echo '```sh'
            echo "cosign verify-blob wafproxy_${version}_linux_amd64 \\"
            echo "  --bundle wafproxy_${version}_linux_amd64.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO}/.github/workflows/release.yml@' \\"
            echo '  --certificate-oidc-issuer https://token.actions.githubusercontent.com'
            echo 'sha256sum -c SHA256SUMS'
            echo "gh attestation verify wafproxy_${version}_linux_amd64 --repo ${REPO}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # GitHub marks every new release Latest unless the call says otherwise, so
      # a batch of older tags leaves whichever job finished last on the badge.
      # Only the highest version on origin asks for it; an older tag asks for the
      # opposite, which also repairs a badge that an old run took.
      - name: Decide whether this tag carries the Latest badge
        id: latest
        run: |-
          set -euo pipefail
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
          if [[ $newest == "$TAG" ]]; then
            echo "origin's newest release is ${TAG}, so it keeps the Latest badge"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "origin's newest release is ${newest:-none}, so ${TAG} leaves the Latest badge alone"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "newest=${newest:-}" >> "$GITHUB_OUTPUT"
      - name: Attach the binaries, bundles and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.latest.outputs.latest }}
          NEWEST: ${{ steps.latest.outputs.newest }}
        run: |-
          set -euo pipefail
          # The written CHANGELOG section is the release body; GitHub's generated
          # notes would publish a commit list instead of what the release says.
          version=${TAG#v}
          notes="${RUNNER_TEMP}/release-notes-${TAG}.md"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside && !started && $0 ~ /^[[:space:]]*$/ { next }
            inside { started = 1; line[++n] = $0; if ($0 ~ /[^[:space:]]/) last = n }
            END { for (i = 1; i <= last; i++) print line[i] }
          ' CHANGELOG.md >"$notes"
          if [[ ! -s $notes ]]; then
            echo "CHANGELOG.md has no section for ${TAG}, so there are no notes to publish" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-runs refresh the body, so a release made before this rule carries
            # the written notes too.
            gh release edit "$TAG" --notes-file "$notes" --latest="${{ steps.latest.outputs.latest }}"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --notes-file "$notes" \
              --title "WAF-Proxy ${TAG#v}" --latest="$LATEST"
          fi
          # Publishing an older release has taken the badge anyway, so asking for
          # it to be left alone is not enough: the newest tag is marked here, and
          # a run for the newest tag is the no-op case of this.
          if [[ $LATEST == false && -n $NEWEST ]]; then
            gh release view "$NEWEST" >/dev/null 2>&1 &&
              gh release edit "$NEWEST" --latest &&
              echo "Latest badge: ${NEWEST}"
          fi

  image:
    name: Build, smoke-test and push the container image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.tag != ''
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The image takes its name from VERSION and its tag from the ref, so a tag
      # that disagrees would publish a mislabelled image.
      - name: Check the tag matches VERSION
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          if [[ ${TAG#v} != "$version" ]]; then
            echo "tag '${TAG}' does not match VERSION ${version} at $(git rev-parse --short HEAD)" >&2
            exit 1
          fi
      # arm64 is built on an amd64 runner, so the runtime stage's apk and
      # setcap steps need the emulators the action registers.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The smoke test runs the platform it is on, so build that one into the
      # local daemon; the multi-platform build below reuses these layers.
      - name: Build the image
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t "wafproxy:${version}" \
            --build-arg VERSION="$version" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      # Boots the image it is about to publish and asks the console's own health
      # endpoint, so a broken image fails here instead of in a user's pull.
      - name: Smoke-test the image
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          # A failure has to name its cause: the job's log needs credentials, so
          # the container's own last words are what lands in the annotation.
          report() {
            local detail
            detail=$(docker logs wafproxy-smoke 2>&1 | tail -n 12 | tr '\n' ' ') || true
            echo "::error::$1: ${detail//%/%25}" >&2
            exit 1
          }
          # The image sets NET_BIND_SERVICE and NET_ADMIN on the binary through
          # file capabilities, and execve refuses a file whose capabilities the
          # container's bounding set cannot grant, so the container needs both
          # or it dies before it can answer.
          docker run -d --name wafproxy-smoke \
            -p 18080:8080 \
            --cap-add NET_ADMIN --cap-add NET_BIND_SERVICE \
            -e WAFPROXY_LISTEN_GUI=0.0.0.0:8080 \
            -e WAFPROXY_GUI_PRIVATE_ONLY=false \
            "wafproxy:${version}"
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:18080/api/health 2>/dev/null); then
              echo "health: $body"
              [[ $body == *'"status":"ok"'* ]] || report "health is not ok"
              [[ $body == *"\"version\":\"${version}\""* ]] || report "the image reports another version"
              exit 0
            fi
            sleep 2
          done
          report "the image never answered /api/health"
      - name: Push to ghcr.io
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          # The documented package is ghcr.io/<owner>/wafproxy, not the lowercased
          # repository path, so pull lines in the docs resolve.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wafproxy"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${image}:${version}" \
            --build-arg VERSION="$version" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --push .
          # A manifest that lost one architecture would still pull on the other,
          # so read the published index back instead of trusting the build.
          docker buildx imagetools inspect --raw "${image}:${version}" > /tmp/index.json
          python3 - <<'PY'
          import json
          index = json.load(open('/tmp/index.json'))
          published = {f"{m['platform']['os']}/{m['platform']['architecture']}"
                       for m in index.get('manifests', [])}
          print('published:', ', '.join(sorted(published)))
          missing = {'linux/amd64', 'linux/arm64'} - published
          if missing:
              raise SystemExit('the published manifest is missing ' + ', '.join(sorted(missing)))
          PY
      # 1.61.0 through 1.65.0 shipped without an image, so a new tag is not
      # automatically the newest image: only move latest when this tag is the
      # newest on origin.
      - name: Point latest at the newest release
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wafproxy"
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
          if [[ $newest != "$TAG" ]]; then
            echo "${TAG} is not the newest tag on origin ('${newest}'), so latest stays where it is"
            exit 0
          fi
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools create -t "${image}:latest" "${image}:${version}"
      # The image that was just built is not the image a user gets: a truncated
      # upload, a missing blob or a package the token can write but not read all
      # look like a green job and a broken pull. So fetch it from the registry
      # and boot that copy instead.
      - name: Pull the published image back and re-check it
        run: |-
          set -euo pipefail
          version=$(cat VERSION)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wafproxy"
          # Same reason as the smoke test above: the annotation is what survives.
          report() {
            local detail
            detail=$(docker logs wafproxy-pulled 2>&1 | tail -n 12 | tr '\n' ' ') || true
            echo "::error::$1: ${detail//%/%25}" >&2
            exit 1
          }
          docker rm -f wafproxy-pulled >/dev/null 2>&1 || true
          docker pull "${image}:${version}"
          docker run -d --name wafproxy-pulled \
            -p 18081:8080 \
            --cap-add NET_ADMIN --cap-add NET_BIND_SERVICE \
            -e WAFPROXY_LISTEN_GUI=0.0.0.0:8080 \
            -e WAFPROXY_GUI_PRIVATE_ONLY=false \
            "${image}:${version}"
          for _ in $(seq 1 40); do
            if body=$(curl -fsS http://127.0.0.1:18081/api/health 2>/dev/null); then
              echo "published image health: $body"
              [[ $body == *'"status":"ok"'* ]] || report "the published image is not healthy"
              [[ $body == *"\"version\":\"${version}\""* ]] || report "the published image reports another version"
              exit 0
            fi
            sleep 2
          done
          report "the published image never answered /api/health"
      - name: Remove the smoke containers
        if: always()
        run: docker rm -f wafproxy-smoke wafproxy-pulled || true
