name: Create release tags

# The tag gate (deploy/check-tags.sh --remote) fails while a version CHANGELOG.md
# dates has no annotated tag on origin. A runner holds the credentials to push
# tags, so this is where the gaps are filled: it tags the commit that stamped
# VERSION, which is the only commit the gate accepts.
on:
  # A version lands as a dated CHANGELOG.md section and a VERSION bump, and the
  # gate is red until its tag exists. Filling it on that push is what stops the
  # tag gate being a manual step; the script skips tags origin already has, so a
  # push that carries neither file never starts this, and any other is a no-op.
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - VERSION
      # Changing how the tags are cut is also a reason to run it.
      - deploy/create-release-tags.sh
      - .github/workflows/release-tags.yml
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space-separated versions to tag (blank: every dated section from 1.61.0)'
        required: false
        default: ''
      dry_run:
        description: Only print the tags that would be created
        type: boolean
        default: true

permissions:
  contents: write
  # Dispatching Release needs this: a ref the job creates with GITHUB_TOKEN
  # raises no push event, so the tag alone publishes nothing.
  actions: write

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  tags:
    name: Create the missing release tags
    runs-on: ubuntu-latest
    env:
      # With a token that may push workflow-spanning tags, the push itself raises
      # the event Release listens for; the App's token raises none, so only that
      # path needs the dispatch at the end.
      WIDE_TOKEN: ${{ secrets.TAG_PUSH_TOKEN != '' }}
    steps:
      # Actions are pinned to commit SHAs, not tags: a moved tag would otherwise
      # change what the job runs while the signature still vouches for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The release commits are history, so the whole graph has to be here.
          fetch-depth: 0
      # The tags are annotated, and git refuses a tag without an identity.
      - name: Give git an identity for the tags
        run: |-
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Create the tags on origin
        env:
          VERSIONS: ${{ inputs.versions }}
          DRY_RUN: ${{ inputs.dry_run }}
          # A tag whose release spans a workflow change is refused to the App, so
          # TAG_PUSH_TOKEN (a token with the workflow scope) is used when it is
          # set; the App token stays the fallback for when it is not.
          TAG_PUSH_TOKEN: ${{ secrets.TAG_PUSH_TOKEN }}
          # The API fallback in the script needs a token, and the repository name.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |-
          set -euo pipefail
          # The checkout leaves the App token in origin's URL and in the same
          # extraheader this uses, and that is the credential that cannot push a
          # workflow-spanning tag. The wider token replaces it in both places, but
          # only after GitHub accepts it: a rejected token would otherwise take
          # the working credential away with it. A stray newline out of the secret
          # rides inside the header, so it is trimmed first.
          if [[ -n ${TAG_PUSH_TOKEN:-} ]]; then
            token=${TAG_PUSH_TOKEN//[[:space:]]/}
            headers=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.github+json' https://api.github.com/user)
            code=$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')
            scopes=$(printf '%s\n' "$headers" | tr -d '\r' |
              awk -F': ' 'tolower($1) == "x-oauth-scopes" {print $2}')
            if [[ $code == 200 ]]; then
              export GH_TOKEN=$token
              git config --local --unset-all 'http.https://github.com/.extraheader' || true
              git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
              git config --local --add 'http.https://github.com/.extraheader' \
                "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
              echo "TAG_PUSH_TOKEN accepted, scopes: ${scopes:-none reported}"
              # The API accepting the token does not prove git can use it, and a
              # silent git exit code leaves nothing to act on. Say what happened
              # and put the App credential back rather than lose the repository.
              if ! git_probe=$(git ls-remote --heads origin refs/heads/main 2>&1); then
                echo "::error::git cannot read origin with TAG_PUSH_TOKEN: ${git_probe//$token/<token>}" >&2
                git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                git config --local --unset-all 'http.https://github.com/.extraheader' || true
                export GH_TOKEN=$GITHUB_TOKEN
              fi
            else
              echo "::warning::TAG_PUSH_TOKEN is not accepted by GitHub (HTTP $code); using the App token, which cannot push a tag that spans a workflow change" >&2
            fi
          fi
          args=()
          if [[ $DRY_RUN == true ]]; then
            args+=(--dry-run)
          fi
          # Word splitting is the point here: the input is a version list.
          # shellcheck disable=SC2206
          versions=($VERSIONS)
          bash deploy/create-release-tags.sh "${args[@]}" "${versions[@]}"
      - name: Check the tags origin now holds
        if: ${{ inputs.dry_run != true }}
        run: bash deploy/check-tags.sh --remote --branch main
      # A ref created with GITHUB_TOKEN raises no push event, so release.yml never
      # saw any tag this job made: the versions it created had no release and no
      # binaries, and the Latest badge stayed on an older release. A dispatch is
      # an event the token may raise, so publishing starts here. A tag that has a
      # release already is left alone, and it runs after a refused tag too,
      # because the other releases do not depend on that one.
      - name: Publish the releases those tags never triggered
        if: ${{ always() && inputs.dry_run != true && env.WIDE_TOKEN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          while read -r tag; do
            gh release view "$tag" >/dev/null 2>&1 && continue
            # Only a version CHANGELOG.md dates is a release, never a stray tag.
            grep -qF "## [${tag#v}] " CHANGELOG.md || continue
            echo "dispatching Release for $tag"
            gh workflow run release.yml --ref main -f "tag=$tag"
          done < <(git tag --list 'v*' --sort=v:refname)
