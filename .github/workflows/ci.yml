name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a moved tag would otherwise
# change what CI runs for a commit that was already reviewed.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tag push runs only the release checks, so publishing a batch of old tags
  # does not rebuild the whole suite for each one; branches keep every job.
  backend:
    name: Go build, vet and race tests
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: Check generated API reference
        run: go run ./tools/openapi -check
      - run: go test -race -count=1 ./...
      # The bypass corpus from the security review, one row per technique. The
      # race run above already executes it; this makes the coverage visible in
      # the log, so a CRS bump or a rule change that loses a technique names the
      # probe that stopped blocking instead of showing up as a silent pass.
      - name: WAF bypass corpus
        run: go test -count=1 -run 'TestBypassCorpus' -v ./internal/waf
      - run: go build ./...

  frontend:
    name: SPA typecheck and build
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Committed console bundle matches the source
        run: |
          # The binary embeds internal/webui/dist, so a release has to carry the
          # bundle built from the same source. A stale bundle ships an old
          # console and makes the update checkout dirty in a way git refuses.
          if [ -n "$(git status --porcelain -- internal/webui/dist)" ]; then
            echo "internal/webui/dist does not match a fresh build:"
            git status --porcelain -- internal/webui/dist
            echo "Run 'npm ci && npm run build' in web/ and commit the result."
            exit 1
          fi
      - name: Production dependency audit
        run: npm audit --omit=dev
        working-directory: web

  updater:
    name: Self-update restore test
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax
        run: for f in deploy/wafproxy-self-update.sh deploy/wafproxy-update-lib.sh deploy/install.sh; do bash -n "$f"; done
      - name: A built checkout blocks git pull and the restore step lets it through
        run: bash deploy/test-self-update-restore.sh

      - name: Guard the updater against restarting its own unit
        run: bash deploy/test-self-update-no-self-restart.sh

  release:
    name: Release metadata and SBOM
    runs-on: ubuntu-latest
    steps:
      # Full history: the tag check proves each release tag is on main, which a
      # depth-1 checkout cannot answer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # First: it reads the tree only, so it still runs while the tags on origin
      # are behind and the check below is failing.
      - name: The runbook describes every tag and release refusal
        run: bash deploy/check-tags-docs_test.sh
      - name: VERSION, newest CHANGELOG section and tag agree
        run: bash deploy/check-version.sh
      - name: The release check still rejects every mismatch
        run: bash deploy/check-version_test.sh
      # A tag backlog must not hide the pin checks, the SBOM or the upload: this
      # step still turns red, but the job carries on and fails at the end.
      - name: Every released section has its annotated tag on origin
        id: tags
        continue-on-error: true
        run: |
          # release-tags.yml creates this commit's tag on the same push, so the
          # first attempt can run before it lands; a real backlog still fails.
          for _ in $(seq 1 12); do
            if bash deploy/check-tags.sh --remote; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: The tag check rejects missing, lightweight and misplaced tags
        run: bash deploy/check-tags_test.sh
      - name: The tag helper only tags commits that stamp VERSION
        run: bash deploy/create-release-tags_test.sh
      - name: Workflow actions are pinned to commits
        run: bash deploy/check-workflow-pins.sh
      - name: The pin check rejects tags, branches and short SHAs
        run: bash deploy/check-workflow-pins_test.sh
      - name: Dockerfile base images are pinned by digest
        run: bash deploy/check-image-pins.sh
      - name: The image pin check rejects tags and short digests
        run: bash deploy/check-image-pins_test.sh
      - name: The dispatch helper covers 1.61.0 to VERSION and refuses an unpushed tag
        run: bash deploy/redispatch-tags_test.sh
      - name: Module SBOM
        run: make sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom.cyclonedx.json
      # Only reads the outcome, so a step skipped by an earlier failure does not
      # report the tag check as the reason the job went red.
      - name: Fail the job when the tag check failed
        if: always()
        run: |
          if [[ "${{ steps.tags.outcome }}" == "failure" ]]; then
            echo "the tag check failed earlier in this job; the steps after it still ran" >&2
            exit 1
          fi

  perf:
    name: Performance gate
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmarks against perf/baseline.json
        run: make perf-gate

  docker:
    name: Container image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: wafproxy:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and check the console answers
        run: bash deploy/docker-smoke-test.sh wafproxy:ci 0.0.0-ci
