name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a moved tag would otherwise
# change what CI runs for a commit that was already reviewed.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tag push runs only the release checks, so publishing a batch of old tags
  # does not rebuild the whole suite for each one; branches keep every job.
  backend:
    name: Go build, vet and race tests
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: Check generated API reference
        run: go run ./tools/openapi -check
      - run: go test -race -count=1 ./...
      - run: go build ./...

  frontend:
    name: SPA typecheck and build
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Committed console bundle matches the source
        run: |
          # The binary embeds internal/webui/dist, so a release has to carry the
          # bundle built from the same source. A stale bundle ships an old
          # console and makes the update checkout dirty in a way git refuses.
          if [ -n "$(git status --porcelain -- internal/webui/dist)" ]; then
            echo "internal/webui/dist does not match a fresh build:"
            git status --porcelain -- internal/webui/dist
            echo "Run 'npm ci && npm run build' in web/ and commit the result."
            exit 1
          fi
      - name: Production dependency audit
        run: npm audit --omit=dev
        working-directory: web

  updater:
    name: Self-update restore test
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Shell syntax
        run: for f in deploy/wafproxy-self-update.sh deploy/wafproxy-update-lib.sh deploy/install.sh; do bash -n "$f"; done
      - name: A built checkout blocks git pull and the restore step lets it through
        run: bash deploy/test-self-update-restore.sh

      - name: Guard the updater against restarting its own unit
        run: bash deploy/test-self-update-no-self-restart.sh

  release:
    name: Release metadata and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: VERSION, newest CHANGELOG section and tag agree
        run: bash deploy/check-version.sh
      - name: The release check still rejects every mismatch
        run: bash deploy/check-version_test.sh
      - name: Module SBOM
        run: make sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: dist/sbom.cyclonedx.json

  perf:
    name: Performance gate
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmarks against perf/baseline.json
        run: make perf-gate

  docker:
    name: Container image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: wafproxy:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
