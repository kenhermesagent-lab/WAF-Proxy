<svg width="1160" height="330" viewBox="0 0 1160 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A request passes from a client through WAF-Proxy's TLS listener, ban and policy stages, Coraza rule screening and routing, then either reaches an upstream or stops with a 403">
  <title>How a request flows through WAF-Proxy</title>
  <desc>Client connects over TLS on 443. WAF-Proxy screens the request through bans, lists, rate limits, bot filtering and OWASP CRS, then routes it to an upstream or blocks it with 403.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F87171" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34D399" />
    </marker>
  </defs>

  <rect width="1160" height="330" fill="#0B1220" />

  <!-- client -->
  <rect x="30" y="112" width="170" height="106" rx="14" fill="#111A2B" stroke="#1E293B" />
  <text x="115" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Client</text>
  <text x="115" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">browser · curl · API</text>
  <text x="115" y="194" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">game server · TV app</text>

  <!-- proxy -->
  <rect x="278" y="34" width="566" height="262" rx="16" fill="#111A2B" stroke="#1E293B" />
  <rect x="278" y="34" width="566" height="38" rx="16" fill="#0F1A2E" />
  <text x="300" y="59" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">WAF-Proxy</text>
  <text x="386" y="59" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748B">one Go binary · embedded SQLite · React console</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#CBD5E1">
    <rect x="300" y="92" width="256" height="34" rx="9" fill="#0E1727" stroke="#1E293B" />
    <text x="316" y="114">TLS · SNI · HTTP/2 · HTTP/3</text>
    <rect x="566" y="92" width="256" height="34" rx="9" fill="#0E1727" stroke="#1E293B" />
    <text x="582" y="114">bans · lists · country/ASN</text>

    <rect x="300" y="136" width="256" height="34" rx="9" fill="#0E1727" stroke="#1E293B" />
    <text x="316" y="158">rate limits · bot filter · PoW</text>
    <rect x="566" y="136" width="256" height="34" rx="9" fill="#0E1727" stroke="#1E293B" />
    <text x="582" y="158">access gates · passphrase · TOTP</text>

    <rect x="300" y="180" width="256" height="34" rx="9" fill="#0B2233" stroke="#0E7490" />
    <text x="316" y="202" fill="#E0F2FE">OWASP CRS via Coraza</text>
    <rect x="566" y="180" width="256" height="34" rx="9" fill="#0E1727" stroke="#1E293B" />
    <text x="582" y="202">routes · load balancing · cache</text>

    <rect x="300" y="224" width="256" height="34" rx="9" fill="#0E1727" stroke="#1E293B" />
    <text x="316" y="246">streaming relays · TCP · UDP</text>
    <rect x="566" y="224" width="256" height="34" rx="9" fill="#0E1727" stroke="#1E293B" />
    <text x="582" y="246">event log · metrics · MCP gateway</text>
  </g>
  <text x="300" y="281" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#64748B">every refusal is logged with its stage, rule id and score</text>

  <!-- upstream -->
  <rect x="922" y="112" width="208" height="106" rx="14" fill="#111A2B" stroke="#1E293B" />
  <text x="1026" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Upstreams</text>
  <text x="1026" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">app · NAS · Plex</text>
  <text x="1026" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">game server · internal CA</text>

  <!-- arrows -->
  <line x1="204" y1="140" x2="272" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="238" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">443</text>

  <line x1="848" y1="140" x2="916" y2="140" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrowGreen)" />
  <text x="882" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#34D399">allow</text>

  <path d="M848 206 H204" stroke="#F87171" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)" />
  <text x="526" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#F87171">403 — blocked before the upstream is contacted</text>
</svg>
