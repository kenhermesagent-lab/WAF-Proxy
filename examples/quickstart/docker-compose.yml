name: wafproxy-quickstart

# A throwaway WAF-Proxy in front of an echo service. Everything is loopback-only:
# no DNS, no certificates, no real backend, no exposure to your network.
#
#   docker compose up -d && ./demo.sh
#
# Host networking is not a shortcut here: the proxy binds the WAN/LAN addresses
# it is given and manages nftables directly, so it behaves the same way it does
# in deploy/docker-compose.yml.

services:
  echo:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:9000", "-text=hello from the upstream"]
    network_mode: host
    restart: unless-stopped

  wafproxy:
    image: ghcr.io/kenhermesagent-lab/wafproxy:${WAFPROXY_VERSION:-1.65.0}
    container_name: wafproxy-quickstart
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    # Do not add no-new-privileges: the image reaches those capabilities through
    # file capabilities, and that flag makes the kernel ignore them.
    environment:
      WAFPROXY_DATA_DIR: /data
      WAFPROXY_LOG_LEVEL: ${WAFPROXY_LOG_LEVEL:-info}
      # Loopback only. The console and the proxy are unreachable from the LAN
      # until you change these and complete the wizard for a real deployment.
      WAFPROXY_LISTEN_GUI: 127.0.0.1:8080
      WAFPROXY_LISTEN_WAN: 127.0.0.1:8443
      WAFPROXY_GUI_PRIVATE_ONLY: "true"
      TZ: ${TZ:-UTC}
    volumes:
      - data:/data
    tmpfs:
      - /tmp:size=16m

volumes:
  data:
