# keepalived for one WAF-Proxy pair. Copy to /etc/keepalived/keepalived.conf.
#
# Node A: priority 150, unicast_src_ip 10.0.0.10, peer 10.0.0.11.
# Node B: priority 100, unicast_src_ip 10.0.0.11, peer 10.0.0.10.
#
# Both nodes start as BACKUP. With nopreempt, a returning former active does not
# take the service address back in the middle of a maintenance window.
#
# keepalived owns the address; WAF-Proxy owns the application role. They meet at
# the local control socket, never over the network.

global_defs {
  router_id wafproxy-a          # wafproxy-b on the other node
  enable_script_security
  script_user root
}

vrrp_instance wafproxy {
  state BACKUP
  interface eth1                # the HA link, not the WAN interface
  virtual_router_id 51
  priority 150                  # 150 on A, 100 on B
  advert_int 1
  nopreempt
  unicast_src_ip 10.0.0.10      # 10.0.0.11 on B
  unicast_peer {
    10.0.0.11                   # 10.0.0.10 on B
  }
  virtual_ipaddress {
    203.0.113.10/24 dev eth1
  }
  notify_master "/usr/local/bin/wafproxy-ha-notify MASTER"
  notify_backup "/usr/local/bin/wafproxy-ha-notify BACKUP"
  notify_fault  "/usr/local/bin/wafproxy-ha-notify FAULT"
}
