name: wafproxy

services:
  wafproxy:
    build:
      context: ..
      args:
        VERSION: ${VERSION:-1.10.0}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        # A fork sets REPO so the Updates page accepts its own checkout.
        REPO: ${REPO:-kenhermesagent-lab/WAF-Proxy-Docker}
    image: wafproxy:${VERSION:-1.10.0}
    container_name: wafproxy
    # Host networking is required: the proxy binds the WAN/LAN addresses chosen
    # in the setup wizard, sees real client IPs, and manages nftables directly.
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    # Do not set no-new-privileges here: the image grants NET_BIND_SERVICE and
    # NET_ADMIN to the non-root binary through file capabilities, and that flag
    # makes the kernel ignore them (the container would fail to bind 443 and
    # nftables would be unavailable).
    environment:
      WAFPROXY_DATA_DIR: /data
      WAFPROXY_LOG_LEVEL: ${WAFPROXY_LOG_LEVEL:-info}
      # First-boot and fallback listeners only: once the wizard has stored the
      # real WAN/LAN addresses, those are used instead. Point the GUI at a LAN
      # address here to keep the setup wizard off the WAN.
      WAFPROXY_LISTEN_GUI: "${WAFPROXY_LISTEN_GUI:-:8080}"
      WAFPROXY_LISTEN_WAN: "${WAFPROXY_LISTEN_WAN:-:8443}"
      WAFPROXY_ACCESS_LOG: /logs/access.log
      # Optional CrowdSec bouncer. Create the key with:
      #   docker exec crowdsec cscli bouncers add wafproxy
      WAFPROXY_CROWDSEC_URL: ${WAFPROXY_CROWDSEC_URL:-}
      WAFPROXY_CROWDSEC_KEY: ${WAFPROXY_CROWDSEC_KEY:-}
      # Optional static token for the /mcp agent gateway. Console-issued tokens
      # work without this; see docs/MCP.md.
      WAFPROXY_MCP_TOKEN: ${WAFPROXY_MCP_TOKEN:-}
      WAFPROXY_MCP_ACTOR: ${WAFPROXY_MCP_ACTOR:-hermes-agent}
      TZ: ${TZ:-UTC}
      # Optional: lets the Plex page mirror its settings into the compose env
      # file. The path must already exist on the host; see docs/INSTALL.md.
      WAFPROXY_ENV_FILE: ${WAFPROXY_ENV_FILE:-}
    volumes:
      - data:/data
      - accesslogs:/logs
      # Optional host-side update helper. Install it once with
      # sudo ./deploy/install-docker-updater.sh; without it the Updates page
      # still checks for application updates but cannot apply them.
      - /run/wafproxy-updates:/run/wafproxy-updates
    tmpfs:
      - /tmp:size=16m
    # First boot listens on :8443 (WAN) and :8080 (GUI). Complete the wizard,
    # then `docker compose restart wafproxy` to bind the addresses it stored.

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.4
    container_name: crowdsec
    profiles: ["crowdsec"]
    network_mode: host
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      CUSTOM_HOSTNAME: wafproxy
      TZ: ${TZ:-UTC}
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - accesslogs:/logs:ro

volumes:
  data:
  accesslogs:
  crowdsec_data:
  crowdsec_config:
